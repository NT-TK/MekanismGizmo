name: Release

on:
  push:
    tags:
      - 'v*-neoforge-1.21.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/mekanismgizmo-1.21.1-*.jar \
            --title "Mekanism Gizmo ${GITHUB_REF_NAME} (NeoForge 1.21.1)" \
            --notes-file CHANGELOG.md \
            --latest=true \
            --verify-tag
