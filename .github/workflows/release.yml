name: Release

on:
  push:
    tags:
      - 'v*-forge-1.20.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/mekanismgizmo-1.20.1-*.jar \
            --title "Mekanism Gizmo ${GITHUB_REF_NAME} (Forge 1.20.1)" \
            --notes-file CHANGELOG.md \
            --latest=false \
            --verify-tag