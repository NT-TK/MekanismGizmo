modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="NT-TK"
logoFile="logo.png"
description='''Mekanismアドオン。ポーション醸造機・製氷機・電動丸石製造機・電動玄武岩製造機・流体注入機・アイテム収集機・風力発電融合機と、ティア付きスポイトを追加します。
各機械（アイテム収集機と風力発電融合機を除く）はティアなし＋Mekanismの基本/発展/精鋭/究極ティアに対応し、ティアが上がるほど並列処理数・エネルギー・タンク容量が増えます。'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.194,)"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
type="required"
versionRange="[10.7.19,10.7.20)"
ordering="AFTER"
side="BOTH"

# Required: the wind generator fusion machine stores and mirrors Mekanism's wind generators
[[dependencies.${mod_id}]]
modId="mekanismgenerators"
type="required"
versionRange="[10.7.19,10.7.20)"
ordering="AFTER"
side="BOTH"

# Optional, client side only: adds the machines to JEI's recipe categories when JEI is installed
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="CLIENT"

# Optional, client side only: EMI gets its own native pages (including the blaze powder gas)
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1,)"
ordering="AFTER"
side="CLIENT"

# Optional: AE2 itself is never required. Its JEI pattern encoding copies the potion brewer page into a pattern
# (the item inputs always transfer; the 5 mB of blaze powder gas only when a chemical capable AE2 addon, such as
# Applied Mekanistics, is installed).
[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
versionRange="[19.2,)"
ordering="AFTER"
side="BOTH"

# Optional: the wind generator fusion machine also accepts the compressed wind generators of Compact Mekanism Machines
# and counts each of them as the generators it replaces. Nothing is compiled against that mod - its items are matched
# by registry name - so this entry only tells mod lists why the two work well together.
[[dependencies.${mod_id}]]
modId="compactmekanismmachines"
type="optional"
versionRange="[0.1,)"
ordering="AFTER"
side="BOTH"
