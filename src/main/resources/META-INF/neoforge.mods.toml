modLoader="javafml"
loaderVersion="[4,)"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="NT-TK"
license="MIT"
logoFile="logo.png"
description='''Mekanismアドオン。ポーション醸造機・製氷機・電動丸石製造機・アイテム収集機・流体注入機を追加します。
各機械（アイテム収集機を除く）はティアなし＋Mekanismの基本/発展/精鋭/究極ティアに対応し、ティアが上がるほど並列処理数・エネルギー・タンク容量が増えます。'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.194,)"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
type="required"
versionRange="[10.7.19,10.7.20)"
ordering="AFTER"
side="BOTH"

# Optional, client side only: adds the machines to JEI's recipe categories when JEI is installed
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="CLIENT"
