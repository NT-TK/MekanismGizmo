authors="NT-TK"
logoFile="logo.png"
description='''Mekanismアドオン（Forge 1.20.1版）。ポーション醸造機・製氷機・電動丸石製造機・電動玄武岩製造機・流体注入機・液体加熱器・アイテム収集機・風力発電融合機・熱発電融合機・機械リセット機・改良型ガス発電機と、ティア付きスポイト、改良型ポータブルテレポーター、改良型設定カードを追加します。
各機械（アイテム収集機・風力発電融合機・熱発電融合機・機械リセット機・改良型ガス発電機を除く）はティアなし＋Mekanismの基本/発展/精鋭/究極ティアに対応し、ティアが上がるほど並列処理数・エネルギー・タンク容量が増えます。'''

