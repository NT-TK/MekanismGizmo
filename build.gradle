plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mekanism 1.20.1 Forge, fetched from Modrinth's Maven.
    implementation fg.deobf('maven.modrinth:mekanism:10.4.16.80')
    implementation fg.deobf('maven.modrinth:mekanism-generators:10.4.16.80')

    // Optional integration: JEI is not bundled and is not required at runtime. 1.20.1 ships JEI support only.
    compileOnly "mezz.jei:jei-1.20.1-forge-api:15.20.0.106"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

processResources {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties properties
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

// Ship the license with the jar
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into ''
    }
    // Development helpers (self tests / audits) must never reach a released jar.
    exclude 'jp/example/mekanismgizmo/Debug*'
}