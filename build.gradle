plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // JEI (RecipeTypes / IModPlugin) - only needed for compilation, JEI itself stays optional at runtime
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    // Modrinth's Maven: Mekanism is fetched from here, so no third party jars live in the repository.
    // Prefer CurseMaven? Add `maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }` and use
    // `implementation 'curse.maven:mekanism-268560:<file-id>'` with the file id from the CurseForge file page
    // (`curse.maven:mekanism-additions-268566:<file-id>` etc. for the optional modules).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // Mekanism: compile + runtime, fetched from Modrinth's Maven (no jars in the repository)
    implementation 'maven.modrinth:mekanism:10.7.19.85'
    // Mekanism Generators: the wind generator fusion machine stores wind generators and mirrors their generation
    implementation 'maven.modrinth:mekanism-generators:10.7.19.85'
    // Optional integration: JEI is not bundled and is not required at runtime.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    // Optional integration: AE2's JEI pattern encoding (compile only, never bundled, not required at runtime)
    compileOnly 'maven.modrinth:ae2:19.2.20'
    // Optional integration: EMI (compile only, never bundled, not required at runtime)
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    // Uncomment to test the JEI integration in the dev client
    // runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"
    // The remaining optional Mekanism modules are only needed by the development client
    runtimeOnly 'maven.modrinth:mekanism-additions:10.7.19.85'
    runtimeOnly 'maven.modrinth:mekanism-tools:10.7.19.85'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties properties
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

// Ship the license with the jar
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into ''
    }
}
